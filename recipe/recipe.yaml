schema_version: 1

context:
  name: importlib-metadata
  version: "0.19"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/27/49/58d50a592d99a6bf58c4c1b02b203a48357a74e33922a9d021fda07d4ce3/importlib_metadata-${{ version }}.tar.gz
  sha256: 23d3d873e008a513952355379d93cbcab874c58f4f034ff657c7a87422fa64e8

build:
  number: 1
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python
    - setuptools_scm
    - setuptools
  run:
    - python
    - zipp
    - configparser
    - contextlib2
    - pathlib2

tests:
  - python:
      imports:
        - importlib_metadata

about:
  homepage: https://gitlab.com/python-devs/importlib_metadata
  license: Apache-2.0
  license_file: LICENSE
  summary: Summary of the package
  documentation: https://importlib_metadata.readthedocs.io
  repository: https://gitlab.com/python-devs/importlib_metadata

extra:
  recipe-maintainers:
    - bgruening
